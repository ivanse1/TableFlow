services:
  db:
    image: postgres:17
    container_name: tableflow-db

    environment:
      POSTGRES_USER: tableflow
      POSTGRES_PASSWORD: tableflow_dev
      POSTGRES_DB: tableflow

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: